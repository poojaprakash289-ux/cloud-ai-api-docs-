<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | Pooja Prakash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #fdfdfd;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      color: #008080;
      margin-bottom: 30px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
    }

    .card h2 {
      margin: 0 0 15px;
      font-size: 18px;
      color: #008080;
    }

    .card a {
      color: #20b2aa;
      text-decoration: none;
      font-weight: bold;
    }

    .card a:hover {
      color: #ffd700;
    }

    form {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    form label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #008080;
    }

    form input, form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    form button {
      background: #008080;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    form button:hover {
      background: #20b2aa;
    }

    .footer {
      text-align: center;
      padding: 20px;
      background: #1f2d3d;
      color: white;
      margin-top: 40px;
    }

    .footer a {
      color: #20b2aa;
      margin: 0 10px;
      text-decoration: none;
    }

    .footer a:hover {
      color: #ffd700;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Contact Me</h1>

  <div class="contact-grid">
    <div class="card">
      <h2>Email</h2>
      <a href="mailto:poojaprakash289@gmail.com">poojaprakash289@gmail.com</a>
    </div>
    <div class="card">
      <h2>LinkedIn</h2>
      <a href="https://www.linkedin.com/in/ezhava-pooja-prakash-06b32b247/" target="_blank">linkedin.com/in/ezhava-pooja-prakash</a>
    </div>
    <div class="card">
      <h2>GitHub</h2>
      <a href="https://github.com/poojaprakash289-ux" target="_blank">github.com/poojaprakash289</a>
    </div>
  </div>

  <form>
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required>

    <label for="email">Your Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>

    <button type="submit">Send Message</button>
  </form>
</div>

<div class="footer">
  © 2026 Pooja Prakash | Senior Technical Writer
  <br>
  <a href="mailto:poojaprakash289@gmail.com">Email</a> |
  <a href="https://www.linkedin.com/in/ezhava-pooja-prakash-06b32b247/" target="_blank">LinkedIn</a> |
  <a href="https://github.com/poojaprakash289-ux" target="_blank">GitHub</a>
</div>

</body>
</html>
